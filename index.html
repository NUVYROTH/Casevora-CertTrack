<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>文件追蹤工作台</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pinyon+Script&display=swap">
<style>
:root{
  /* Casevoras 品牌色：深藍、米色、金色（與客訴、衛生缺失工具一致） */
  --bg:#f5efe3; --card:#fffdf8; --ink:#16213a; --muted:#5d6779; --line:#e3d9c6;
  --brand:#16213a; --brand-soft:#f3ece0; --gold:#b8955a; --field:#c9bda6; --warn:#b45309; --warn-soft:#fff4e0;
  --bad:#b42318; --bad-soft:#fdecea; --ok:#167a3e; --ok-soft:#e6f5ec; --info:#1d4f91; --info-soft:#e8f0fb;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",system-ui,sans-serif;font-size:15px;line-height:1.65}
header.topbar{background:var(--brand);color:#fffdf8;border-bottom:3px solid var(--gold);position:sticky;top:0;z-index:50}
.tbin{max-width:1320px;margin:0 auto;padding:10px 16px;display:flex;flex-wrap:wrap;gap:6px 20px;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:14px}
.logo{width:56px;height:56px;border-radius:50%;flex:none;display:block;box-shadow:0 0 0 1px rgba(184,149,90,.5),0 2px 8px rgba(0,0,0,.35)}
.bname{font:400 36px/1.05 "Pinyon Script",Georgia,"Times New Roman",serif;color:#e2c891;letter-spacing:.01em}
.bsub{font-size:14px;font-weight:700;opacity:.92;letter-spacing:.14em;margin-top:2px}
.tbmeta{font-size:12.5px;opacity:.85;display:flex;align-items:center;gap:10px}
.ver{border:1px solid var(--gold);color:var(--gold);border-radius:999px;padding:0 8px;font-size:11.5px}
@media(max-width:600px){.tbmeta{display:none}}
main{max-width:1440px;margin:0 auto;padding:20px 16px 100px}
.appg{display:grid;grid-template-columns:184px minmax(0,1fr);gap:18px;align-items:start}
.appg>*{min-width:0}
.snav{position:sticky;top:84px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:4px}
.snav button{display:flex;align-items:center;gap:10px;text-align:left;border:0;border-radius:10px;padding:10px 12px;background:none;color:var(--muted);font-weight:600}
.snav button:hover{background:#f3ece0;color:var(--ink)}
.snav button.on,.snav button.on:hover{background:var(--brand);color:#fffdf8}
.snav .ic{width:26px;height:26px;border-radius:8px;background:#efe6d5;display:inline-flex;align-items:center;justify-content:center;font-size:14px;flex:none;color:var(--ink)}
.snav button.on .ic{background:var(--gold)}
.sbrand,.slab,.sfoot{display:none}
.alert{display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:#fdecea;color:#8a1c12;border:1px solid #e3a59c;border-left:5px solid #8a1c12;border-radius:8px;padding:12px 14px;font-size:14px;line-height:1.7}
.alert .a1{flex:1 1 260px;font-weight:700}
.atag{flex:none;background:#8a1c12;color:#fff;font-weight:700;font-size:12.5px;border-radius:4px;padding:2px 8px;letter-spacing:.1em}
.alink{flex:none;background:transparent;border:1px solid #e3a59c;color:#8a1c12;font-size:13px;padding:4px 10px}
.alink:hover{background:#fff}
.gh{margin:10px 0 4px;font-size:14px;border-left:3px solid var(--gold);padding-left:6px}
.hcard{margin-bottom:14px}
.hc-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;padding-bottom:14px;border-bottom:1px solid var(--line);margin-bottom:14px}
.ptitle{min-width:0;flex:1 1 360px}
.ptitle h1{font-size:28px;margin:0 0 2px;line-height:1.3}
.eyebrow{display:flex;align-items:center;gap:10px;margin:0 0 8px;font-size:12px;font-weight:800;letter-spacing:.22em;color:var(--gold)}
.eyebrow::before{content:"";width:28px;height:2px;background:var(--gold);border-radius:2px;flex:none}
.ptitle .muted{font-size:14.5px}
.lbadge{flex:none;background:var(--ok-soft);color:var(--ok);border-radius:999px;padding:3px 12px;font-weight:700;font-size:12.5px;white-space:nowrap}
.hc-bot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:14px}
.hcrumb{font-size:13px;color:var(--muted)}
.hcrumb b{color:var(--ink)}
.ptools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:flex-end}
button.lite{background:var(--card);border-color:var(--line);color:var(--ink);font-size:13.5px;padding:6px 12px}
button.lite:hover{background:#f3ece0}
button.pnew{font-size:13.5px;padding:6px 12px;border:1px solid var(--brand)}
.crumb{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13px;color:var(--muted);margin:0 0 12px}
.crumb b{color:var(--ink)}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:14px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 58px 12px 16px;position:relative;overflow:hidden;min-width:0}
.kpi:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--gold)}
.kpi.warn:before{background:var(--bad)}
.kpi.ok:before{background:var(--ok)}
.kpi.info:before{background:var(--info)}
.kpi .l{font-size:13px;color:var(--muted);font-weight:600}
.kpi .n{font-size:30px;font-weight:800;line-height:1.2;font-variant-numeric:tabular-nums}
.kpi .n small{font-size:14px;font-weight:600;color:var(--muted);margin-left:2px}
.kpi .d{font-size:12.5px;color:var(--muted)}
.kic{position:absolute;top:12px;right:12px;width:34px;height:34px;border-radius:9px;background:#f3ece0;color:#8a6a35;display:flex;align-items:center;justify-content:center}
.kic.kw{background:var(--bad-soft);color:var(--bad)}
.kic.kok{background:var(--ok-soft);color:#1e9e52}
.kic.kin{background:var(--info-soft);color:var(--info)}
.dgrid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:14px;align-items:start;margin-bottom:14px}
.dgrid>*{min-width:0}
.dgrid>.card{margin-bottom:0}
.rcol{display:flex;flex-direction:column;gap:14px}
.rcol .card{margin-bottom:0}
.phd{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.phd b{font-size:16px}
.mini{list-style:none;margin:0;padding:0}
.mini li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.mini li:last-child{border:0}
.mini li.click{cursor:pointer}
.mini li.click:hover{background:#f7f1e6}
.trow{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-top:10px;background:var(--card);cursor:pointer;width:100%;text-align:left}
.trow:hover{background:#f7f1e6;border-color:var(--gold)}
.trow .ic{width:40px;height:40px;border-radius:10px;background:#f3ece0;display:flex;align-items:center;justify-content:center;font-size:20px;flex:none}
.trow .tx{flex:1;min-width:0}
.trow .tx b{font-size:16px;display:block}
.trow .tx span{font-size:13px;color:var(--muted)}
.trow .cnt{font-size:13px;color:var(--muted);white-space:nowrap}
.trow .cnt b{color:var(--bad);font-size:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:14px;box-shadow:0 1px 2px rgba(22,33,58,.06)}
.card h2{margin:0 0 12px;font-size:17px;display:flex;align-items:center;gap:8px}
.card h2 .no{background:var(--brand);color:#fff;border-radius:50%;width:24px;height:24px;display:inline-flex;align-items:center;justify-content:center;font-size:13px;flex:none}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px 16px}
.full{grid-column:1/-1}
label.f{display:block;font-size:13px;color:var(--muted);margin-bottom:4px;font-weight:600}
.req::after{content:" *";color:var(--bad)}
input[type=text],input[type=date],select,textarea{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:6px;font:inherit;background:var(--bg);color:inherit}
textarea{min-height:70px;resize:vertical}
input.bad{border-color:var(--bad)!important;background:var(--bad-soft)!important}
input:disabled,select:disabled,textarea:disabled{background:#f3ece0;color:#444}
button{font:inherit;cursor:pointer;border-radius:6px;border:1px solid var(--field);background:var(--card);color:var(--ink);padding:7px 14px}
button:hover{background:#f3ece0}
button.primary{background:var(--brand);border-color:var(--brand);color:#fff}
button.primary:hover{background:#22304f}
button.danger{color:var(--bad);border-color:#e7b4ae}
button:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(184,149,90,.25);background:#fff}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.spacer{flex:1}
.badge{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}
.notice{border-radius:8px;padding:10px 14px;font-size:14px;margin:8px 0}
.notice.info{background:var(--info-soft);color:#173d70}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{border-bottom:1px solid var(--line);padding:8px 8px;text-align:left;vertical-align:top}
th{background:#f7f1e6;color:var(--muted);font-weight:600;white-space:nowrap}
td{overflow-wrap:anywhere}
.st-sub,td .badge,td.nw{white-space:nowrap;overflow-wrap:normal}
.mini li>span{min-width:0;overflow-wrap:anywhere}
.trow .tx b{overflow-wrap:anywhere}
tbody tr.click{cursor:pointer}
tbody tr.click:hover{background:#f7f1e6}
.muted{color:var(--muted)}
.small{font-size:13px}
.tabs button{border-radius:999px;padding:4px 14px}
.tabs button.on{background:var(--brand);color:#fff;border-color:var(--brand)}
input.lsearch,select.lsel{background:#f3ece0}
.savebar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:10px 16px;box-shadow:0 -2px 8px rgba(0,0,0,.05);z-index:30}
.savebar .in{max-width:1100px;margin:0 auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.dl-input{border:2px solid var(--gold)!important;background:#fbf6ec!important}
.dl-input.bad{border-color:var(--bad)!important;background:var(--bad-soft)!important}
.dl-hint{font-size:12px;color:#8a6a35;margin-top:3px}
.ferr{color:var(--bad);font-size:13px;font-weight:700;margin-top:3px}
.dirty{color:var(--warn);font-weight:700;font-size:14px}
details summary{cursor:pointer;font-weight:700}
.empty{text-align:center;padding:40px;color:var(--muted)}
.s-late{background:#fdecea;color:#7d1a12}
.s-miss{background:#fff4e0;color:#7a3d06}
.s-need{background:#efe9fb;color:#5b3a9c}
.s-ok{background:#e6f5ec;color:#0f5a2d}
.q-pending{background:#e9ecea;color:#4b5a55}
.q-pass{background:#e6f5ec;color:#0f5a2d}
.q-fail{background:#fdecea;color:#7d1a12}
.st-sub{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.modal{position:fixed;inset:0;background:rgba(22,33,58,.45);display:flex;align-items:center;justify-content:center;z-index:200;padding:16px}
.modal .box{background:var(--card);border:1px solid var(--line);border-top:4px solid var(--gold);border-radius:10px;max-width:440px;width:100%;padding:18px 20px;box-shadow:0 8px 30px rgba(0,0,0,.25)}
.modal .msg{white-space:pre-wrap;margin-bottom:14px}
.modal .row{justify-content:flex-end}
.selall{display:inline-flex;align-items:center;gap:6px;font-size:14px}
.selall input,td input[type=checkbox]{width:18px;height:18px;accent-color:var(--brand)}
.lcount{font-size:13px;color:var(--muted);margin-bottom:6px}
.pager{margin-top:12px}
td.ac{white-space:nowrap}
td.ac button{padding:4px 10px;font-size:13px}
.range{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.range input[type=text]{width:110px}
.range select{width:auto}
.range .u{font-weight:700;min-width:28px}
.range + .range{margin-top:8px}
.atts{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}
.att{width:130px;border:1px solid var(--line);border-radius:8px;padding:6px;background:#fbf8f1;font-size:12px}
.att a.pv{display:flex;align-items:center;justify-content:center;height:100px;border-radius:6px;background:#f3ece0;overflow:hidden;text-decoration:none;font-size:40px}
.att img{width:100%;height:100%;object-fit:cover}
.att .nm{display:block;margin:4px 0;word-break:break-all;line-height:1.3}
.att button{padding:2px 8px;font-size:12px}
@media(max-width:1100px){ .dgrid{grid-template-columns:1fr} }
@media(max-width:900px){
  .appg{grid-template-columns:1fr}
  .snav{position:static;flex-direction:row;overflow-x:auto;padding:6px}
  .snav .spacer{display:none}
  .snav button{white-space:nowrap;padding:8px 10px}
  .kpis{grid-template-columns:1fr 1fr;gap:8px}
  .kpi{padding:10px 40px 10px 12px} .kpi .n{font-size:25px}
  .kic{width:26px;height:26px;top:10px;right:8px} .kic svg{width:15px;height:15px}
  .ptitle h1{font-size:24px}
  .ptools{justify-content:flex-start}
}
@media(min-width:900px){
  header.topbar{display:none}
  body{padding-left:248px}
  .appg{display:block}
  .sbrand{display:flex;align-items:center;gap:12px;padding:6px 8px 18px}
  .sbrand img{width:44px;height:44px;border-radius:50%;box-shadow:0 0 0 1px rgba(184,149,90,.6)}
  .sbn{font:400 28px/1 "Pinyon Script",Georgia,serif;color:#e2c891}
  .sbs{font-size:10.5px;letter-spacing:.16em;color:#9fb0cf;margin-top:4px}
  .slab{display:block;font-size:11px;letter-spacing:.14em;color:#8796b3;padding:0 10px 8px}
  .sfoot{display:block;border-top:1px solid rgba(255,255,255,.12);margin-top:12px;padding:12px 10px 4px;font-size:12px;line-height:1.7;color:#9fb0cf}
  .sfoot b{color:#d6deec;font-weight:600;letter-spacing:.04em}
  .snav{position:fixed;left:0;top:0;bottom:0;width:248px;z-index:20;overflow:auto;background:#1a2a44;border:0;border-radius:0;padding:18px 14px}
  .snav button{color:#d6deec;padding:11px 12px;white-space:nowrap}
  .snav button:hover{background:rgba(255,255,255,.08);color:#fff}
  .snav button.on,.snav button.on:hover{background:#2c4166;color:#fff}
  .snav .ic{background:rgba(255,255,255,.1);color:#fff}
  .snav button.on .ic{background:var(--gold)}
  .savebar{left:248px}
}
</style>
</head>

</div></main>
<input type="file" id="restoreFile" accept=".json" hidden onchange="restore(this)">
<input type="file" id="xlsxFile" accept=".xlsx" hidden onchange="importXlsx(this)">
<script>
const KEY = 'casevoraCoaTracker_v2';
const OLD_KEY = 'casevoraCoaTracker_v1';
const TYPES = {
  coa: {name:'廠商COA報告',       months:12, lead:3, per:'1y', sup:'供應商名稱', item:'原料或產品名稱', ic:'📄',
        eb:'CERTIFICATE OF ANALYSIS',   desc:'供應商提供的原料或產品檢驗證明，掌握缺件、到期與品質確認。'},
  raw: {name:'原物料外檢報告',     months:4,  lead:1, per:'4m', sup:'供應商名稱', item:'原料或產品名稱', ic:'🧪',
        eb:'RAW MATERIAL TEST REPORTS', desc:'原物料委外檢驗報告，預設每 4 個月更新一次。'},
  cal: {name:'儀器校正外檢報告',   months:12, lead:3, per:'1y', sup:'校正公司',   item:'儀器名稱', ic:'⚖️',
        eb:'INSTRUMENT CALIBRATION',    desc:'磅秤、溫度計等儀器的外部校正報告與校正範圍。'}
};
/* 儀器：[名稱, 可選單位（第一個是預設）, 第二組範圍的單位] ；單位 null＝自己打字 */
const INSTR = [
  ['磅秤',['g','kg']], ['地磅',['kg','g']], ['台秤',['kg','g']],
  ['溫度計',['°C']], ['紅外線溫度計',['°C']], ['留點溫度計',['°C']],
  ['溫濕度計',['°C'],'%'], ['其他',null]
];
const instrOf = name => INSTR.find(x=>x[0]===name);
const QC = {pending:'尚未判定', pass:'合格', fail:'不合格'};
const CATS = ['水產','家畜','禽類','蔬菜＋副原料','調味料','香料','包材','其他'];
const PERIODS = [['4m','4 個月',4],['6m','半年',6],['1y','1 年',12],['2y','2 年',24],['3y','3 年',36],['5y','5 年',60],['custom','自訂日期',0]];
const PROVIDE = ['隨貨','紙本','電子檔','官網下載','其他'];
let records = [];
records = loadAll();
let view = 'home', curType = 'coa';
let cur = null, dirty = false;
let listTab = 'todo', listSearch = '', listStatus = '', listCat = '';
const PAGE_SIZES = [20,30,50,100];
let listPage = 1, pageSize = 20;
try{ const ps=parseInt(localStorage.getItem('casevoraCoaTracker_pageSize'),10); if(PAGE_SIZES.includes(ps)) pageSize=ps; }catch(e){}
let listSel = new Set(), trashSel = new Set();
const live = () => records.filter(r=>!r.deleted);
const ofType = t => live().filter(r=>r.docType===t);
const $ = s => document.querySelector(s);

/* ---------- 小工具 ---------- */
function esc(s){ return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
const p2 = n => String(n).padStart(2,'0');
function today(){ const d=new Date(); return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10); }
function addDays(ymd,n){ const [y,m,d]=ymd.split('-').map(Number); const t=new Date(y,m-1,d+n); return t.getFullYear()+'-'+p2(t.getMonth()+1)+'-'+p2(t.getDate()); }
function addMonths(ymd,n){ const [y,m,d]=ymd.split('-').map(Number); const t=new Date(y,m-1+n,1); const last=new Date(t.getFullYear(),t.getMonth()+1,0).getDate(); return t.getFullYear()+'-'+p2(t.getMonth()+1)+'-'+p2(Math.min(d,last)); }
function daysBetween(a,b){ const [y1,m1,d1]=a.split('-').map(Number), [y2,m2,d2]=b.split('-').map(Number); return Math.round((new Date(y2,m2-1,d2)-new Date(y1,m1-1,d1))/86400000); }
function fmtDate(s){ if(!s) return ''; const [y,m,d]=s.split('-'); return `${y}/${m}/${d}`; }
/* 頁面內的確認視窗（與 Casevoras 其他工具一致） */
function dialog(msg, okText, cancelText){
  return new Promise(res => {
    const m = document.createElement('div'); m.className = 'modal';
    m.innerHTML = `<div class="box" role="dialog" aria-modal="true"><div class="msg"></div><div class="row">${cancelText?`<button id="dlgNo">${cancelText}</button>`:''}<button class="primary" id="dlgYes">${okText}</button></div></div>`;
    m.querySelector('.msg').textContent = msg;
    const done = v => { m.remove(); res(v); };
    m.querySelector('#dlgYes').onclick = () => done(true);
    if(cancelText) m.querySelector('#dlgNo').onclick = () => done(false);
    document.body.appendChild(m); m.querySelector('#dlgYes').focus();
  });
}
const ask = msg => dialog(msg, '確定', '取消');
function flash(t){
  const d = document.createElement('div'); d.textContent = t;
  d.style.cssText = 'position:fixed;top:16px;left:50%;transform:translateX(-50%);background:#1f6f5c;color:#fff;padding:8px 20px;border-radius:6px;z-index:99;box-shadow:0 2px 8px rgba(0,0,0,.2)';
  document.body.appendChild(d); setTimeout(()=>d.remove(),1500);
}
function download(content, name, type){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([content],{type})); a.download = name;
  document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 500);
}

/* ---------- 附件（圖片／PDF）存在瀏覽器的 IndexedDB ---------- */
const MAX_FILE = 20*1024*1024;
let dbp = null, attUrls = [];
function db(){ return dbp || (dbp = new Promise((ok,no)=>{ const q=indexedDB.open('casevoraCoaFiles',1);
  q.onupgradeneeded=()=>q.result.createObjectStore('files',{keyPath:'id'}); q.onsuccess=()=>ok(q.result); q.onerror=()=>no(q.error); })); }
async function fx(mode, fn){ const d=await db(); return new Promise((ok,no)=>{ const tx=d.transaction('files',mode), q=fn(tx.objectStore('files'));
  tx.oncomplete=()=>ok(q&&q.result); tx.onerror=()=>no(tx.error); tx.onabort=()=>no(tx.error); }); }
const fPut = o => fx('readwrite', st=>st.put(o));
const fGet = id => fx('readonly', st=>st.get(id));
const fAll = () => fx('readonly', st=>st.getAll());
const fKeys = () => fx('readonly', st=>st.getAllKeys());
const fClear = () => fx('readwrite', st=>st.clear());
function fmtSize(n){ return n>=1048576 ? (n/1048576).toFixed(1)+' MB' : Math.max(1,Math.round(n/1024))+' KB'; }
/* 刪掉沒有任何紀錄在用的附件（包含「最近刪除」裡的紀錄都算在用） */
async function cleanupFiles(){
  try{
    const used=new Set(records.flatMap(r=>(r.files||[]).map(f=>f.id)));
    if(cur) (cur.files||[]).forEach(f=>used.add(f.id));
    const keys=(await fKeys()).filter(k=>!used.has(k));
    if(keys.length) await fx('readwrite', st=>{ keys.forEach(k=>st.delete(k)); });
  }catch(e){}
}
const blobToDataUrl = b => new Promise((ok,no)=>{ const fr=new FileReader(); fr.onload=()=>ok(fr.result); fr.onerror=()=>no(fr.error); fr.readAsDataURL(b); });

/* ---------- 資料 ---------- */
function blankRecord(type){
  return {uid:'', docType:type||'coa', docNo:'', supplier:'', item:'', itemOther:'', rFrom:'', rTo:'', rUnit:'', r2From:'', r2To:'',
          fileLoc:'', files:[], category:'', period:'', testItems:'', testReq:'', provide:'', importExpiry:'', importKey:'', receivedDate:'', dueDate:'', qc:'pending', note:'', createdAt:'', createdTs:0, updatedAt:''};
}
function newUid(){ let u; do{ u='r'+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }while(records && records.some(r=>r.uid===u)); return u; }
/* 舊版（v1）紀錄也能讀：舊編號 COA-001 搬到「文件編號」，儀器名稱不在選單裡的放進「其他」 */
function migrate(r){
  r = r||{};
  const o = Object.assign(blankRecord(r.docType), r);
  if(!TYPES[o.docType]) o.docType='coa';
  if(!QC[o.qc]) o.qc='pending';
  if(!Array.isArray(o.files)) o.files=[];
  if(!PERIODS.some(x=>x[0]===o.period)) o.period=(TYPES[o.docType]||TYPES.coa).per;
  if(!o.uid){ o.uid=newUid(); if(!o.docNo && r.id) o.docNo=String(r.id); }
  delete o.id;
  if(o.docType==='cal' && o.item && !instrOf(o.item)){ o.itemOther=o.item; o.item='其他'; }
  return o;
}
function loadAll(){
  try{
    const v2 = localStorage.getItem(KEY);
    if(v2) return JSON.parse(v2).map(migrate);
    const v1 = localStorage.getItem(OLD_KEY);
    if(v1){ const rs=(JSON.parse(v1)||[]).map(migrate); localStorage.setItem(KEY, JSON.stringify(rs)); return rs; }
  }catch(e){}
  return [];
}
function persist(){
  try{
    localStorage.setItem(KEY, JSON.stringify(records));
    const used=(localStorage.getItem(KEY)||'').length;
    if(used>4000000 && !window.__warned){ window.__warned=true; alert('提醒：本機儲存空間已用約 80% 以上。請盡快按「下載備份」，並刪除不需要的舊紀錄。'); }
    return true;
  }catch(e){ alert('儲存失敗！\n瀏覽器的儲存空間可能已滿。請先「下載備份」，再刪除部分紀錄。'); return false; }
}

/* ---------- 顯示用 ---------- */
function itemLabel(r){ return r.item==='其他' ? (r.itemOther||'其他') : r.item; }
function rangeText(r){
  if(r.docType!=='cal') return '';
  const one=(a,b,u)=> (a||b) ? `${a||'?'}～${b||'?'} ${u||''}`.trim() : '';
  const ins=instrOf(r.item);
  return [one(r.rFrom,r.rTo,r.rUnit), ins&&ins[2] ? one(r.r2From,r.r2To,ins[2]) : ''].filter(Boolean).join('｜');
}

/* ---------- 狀態規則（依日期自動判斷） ---------- */
const perOf = r => PERIODS.find(x=>x[0]===r.period) || PERIODS.find(x=>x[0]===(TYPES[r.docType]||TYPES.coa).per);
const perLabel = r => perOf(r)[1];
function monthsOf(r){ const m=perOf(r)[2]; return m || null; }
/* 到期前多久開始顯示「需要更新」：週期一年以上提前 3 個月，未滿一年提前 1 個月 */
function leadOf(r){
  let m=monthsOf(r);
  if(m==null) m = r.receivedDate&&r.dueDate ? daysBetween(r.receivedDate,r.dueDate)/30 : 12;
  return m>=12 ? 3 : 1;
}
/* 有填進口分析／輸入許可效期時，一起列入判斷 */
function statusOf(r){
  const s=baseStatus(r);
  if(!r.importExpiry || s.k==='missing') return s;
  const d=daysBetween(today(),r.importExpiry), add=x=>(s.extra?s.extra+'｜':'')+x;
  if(d<0) return s.k==='late' ? Object.assign({},s,{extra:add(`進口效期已過 ${-d} 天`)}) : {k:'late', t:'尚未更新', c:'s-late', rank:0, extra:`進口效期已過 ${-d} 天`, days:-d};
  if(d<=30) return s.k==='ok' ? {k:'need', t:'需要更新', c:'s-need', rank:2, extra:`進口效期剩 ${d} 天`} : Object.assign({},s,{extra:add(`進口效期剩 ${d} 天`)});
  return s;
}
function baseStatus(r){
  const td = today();
  if(!r.receivedDate) return {k:'missing', t:'缺件', c:'s-miss', rank:1, extra:'尚未收到文件'};
  if(r.dueDate && r.dueDate < td){ const d=daysBetween(r.dueDate,td); return {k:'late', t:'尚未更新', c:'s-late', rank:0, extra:`逾期 ${d} 天`, days:d}; }
  const left = r.dueDate ? daysBetween(td,r.dueDate) : null;
  const soon = r.dueDate && addMonths(td,leadOf(r)) >= r.dueDate;
  if(r.qc==='fail' || soon){
    const parts=[]; if(r.qc==='fail') parts.push('品質不合格，需換新版'); if(left!=null) parts.push(`剩 ${left} 天到期`);
    return {k:'need', t:'需要更新', c:'s-need', rank:2, extra:parts.join('｜')};
  }
  return {k:'ok', t:'已更新', c:'s-ok', rank:3, extra:left!=null?`還有 ${left} 天到期`:''};
}
function statusBadge(r){ const s=statusOf(r); return `<span class="badge ${s.c}">${s.t}</span>${s.extra?`<span class="st-sub">${esc(s.extra)}</span>`:''}`; }
function qcBadge(r){ const c={pending:'q-pending',pass:'q-pass',fail:'q-fail'}[r.qc]; return `<span class="badge ${c}">${QC[r.qc]}</span>`; }
function autoOf(r){ const m=monthsOf(r); return r.receivedDate && m ? addMonths(r.receivedDate,m) : ''; }

function leave(){ if(dirty && !confirm('有尚未儲存的修改，確定要離開嗎？')) return false; dirty=false; cur=null; cleanupFiles(); return true; }

/* =========================================================
   共用版面：標題卡、數字卡、側邊選單（與 Casevoras 其他工具一致）
   ========================================================= */
const KIC = {
  doc:'<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>',
  clock:'<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
  cal:'<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>',
  x:'<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M9 9l6 6M15 9l-6 6"/></svg>'
};
function setSide(v){ document.querySelectorAll('#side button[data-v]').forEach(b=>b.classList.toggle('on', b.dataset.v===v)); }
function headHTML(title, eb, desc, crumb, tools){
  return `<div class="hcard">
    <div class="hc-top"><div class="ptitle"><h1>${title}</h1><div class="eyebrow">${eb}</div><span class="muted">${desc}</span></div>
      <span class="lbadge">● 本機資料模式</span></div>
    <div class="alert" role="note"><span class="atag">重要</span><div class="a1">本機儲存 · 僅在此裝置此瀏覽器有效 · 請勿用無痕視窗 · 定期下載備份</div><button class="alink" onclick="openGuide()">查看使用說明</button></div>
    <div class="hc-bot"><div class="hcrumb">Casevoras / <b>${crumb}</b></div><div class="ptools">${tools}</div></div>
  </div>`;
}
const backupTools = () => `<button class="lite" onclick="backup()" title="下載所有紀錄與附件的備份檔">下載備份</button>
  <button class="lite" onclick="$('#restoreFile').click()" title="用備份檔還原；會取代目前資料">從備份還原</button>`;
function crumbHTML(path){ return `<div class="crumb"><span>Casevoras / ${path}</span><span class="lbadge">● 本機資料模式</span></div>`; }
const dueIn = r => { const s=statusOf(r); return s.k==='late'||!r.dueDate||!r.receivedDate ? null : daysBetween(today(),r.dueDate); };
function kpiHTML(rs){
  const st=rs.map(statusOf), todo=st.filter(s=>s.k!=='ok').length;
  const miss=st.filter(s=>s.k==='missing').length, need=st.filter(s=>s.k==='need').length;
  const late=st.filter(s=>s.k==='late'), maxLate=late.reduce((m,s)=>Math.max(m,s.days||0),0);
  const soon=rs.map(dueIn).filter(d=>d!=null&&d<=30), fail=rs.filter(r=>r.qc==='fail').length;
  return `<div class="kpis">
    <div class="kpi"><span class="kic" aria-hidden="true">${KIC.doc}</span><div class="l">待辦</div><div class="n">${todo}<small>件</small></div><div class="d">${todo?`缺件 ${miss}・需要更新 ${need}・逾期 ${late.length}`:'目前沒有待辦'}</div></div>
    <div class="kpi warn"><span class="kic kw" aria-hidden="true">${KIC.clock}</span><div class="l">已逾期（尚未更新）</div><div class="n">${late.length}<small>件</small></div><div class="d">${late.length?`最久逾期 ${maxLate} 天`:'目前沒有逾期'}</div></div>
    <div class="kpi info"><span class="kic kin" aria-hidden="true">${KIC.cal}</span><div class="l">30 天內到期</div><div class="n">${soon.length}<small>件</small></div><div class="d">${soon.length?`最快 ${Math.min(...soon)} 天後到期`:'30 天內沒有要到期的'}</div></div>
    <div class="kpi warn"><span class="kic kw" aria-hidden="true">${KIC.x}</span><div class="l">品質不合格</div><div class="n">${fail}<small>件</small></div><div class="d">${fail?'需請供應商換新版':'目前沒有不合格'}</div></div>
  </div>`;
}
function panelsHTML(rs){
  const order=[['late','尚未更新','s-late'],['missing','缺件','s-miss'],['need','需要更新','s-need'],['ok','已更新','s-ok']];
  const att=rs.filter(r=>statusOf(r).k!=='ok').sort((a,b)=>{ const sa=statusOf(a), sb=statusOf(b);
    if(sa.rank!==sb.rank) return sa.rank-sb.rank; return (a.dueDate||'9999').localeCompare(b.dueDate||'9999'); }).slice(0,5);
  const label=r=>r.docType==='cal'?itemLabel(r):r.supplier;
  return `<div class="card"><div class="phd"><b>文件狀態</b><span class="muted small">全部 ${rs.length} 件</span></div>
      <ul class="mini">${order.map(([k,n,c])=>`<li><span class="badge ${c}">${n}</span><b>${rs.filter(r=>statusOf(r).k===k).length}</b></li>`).join('')}</ul></div>
    <div class="card"><div class="phd"><b>需要注意</b><span class="muted small">最急的 5 件</span></div>
      ${att.length?`<ul class="mini">${att.map(r=>{ const s=statusOf(r); return `<li class="click" onclick="openFrom('${r.uid}')"><span>${esc(label(r))}<br><span class="muted small">${esc(TYPES[r.docType].name)}${r.docNo?'・'+esc(r.docNo):''}</span></span><span class="badge ${s.c}">${s.k==='late'?esc(s.extra):s.t}</span></li>`; }).join('')}</ul>`:'<div class="muted small">目前沒有需要處理的文件。</div>'}</div>`;
}
function openFrom(uid){ const r=records.find(x=>x.uid===uid); if(!r) return; if(!leave()) return; curType=r.docType; openRecord(uid); }
function openGuide(){ showHome(); if(view!=='home') return; const g=$('#guide'); if(g){ g.open=true; g.scrollIntoView({behavior:'smooth',block:'start'}); } }

/* =========================================================
   總覽頁
   ========================================================= */
function showHome(){
  if(!leave()) return;
  view='home'; setSide('home');
  const L=live();
  $('#app').innerHTML = `
    ${headHTML('文件追蹤工作台','SUPPLIER DOCUMENT TRACKING','從收件、到期提醒到品質確認，讓每一份文件都有紀錄、不漏更新。','總覽',
      `<button class="primary pnew" onclick="exportXlsx()" title="匯出全部紀錄：摘要、總表與三類文件各一個工作表">匯出全部（Excel）</button>
       <button class="lite" onclick="$('#xlsxFile').click()" title="從原料檢驗報告追蹤表（.xlsx）匯入；匯入前會先預覽">從 Excel 匯入</button>
       <button class="lite" onclick="showTrash()">最近刪除（${records.filter(r=>r.deleted).length}）</button>${backupTools()}`)}
    ${kpiHTML(L)}
    <div class="dgrid">
      <div class="card"><div class="phd"><b>文件清單</b><span class="muted small">點選進入</span></div>
        ${Object.entries(TYPES).map(([k,t])=>{ const rs=ofType(k), todo=rs.filter(r=>statusOf(r).k!=='ok').length;
          return `<button class="trow" onclick="showList('${k}')"><span class="ic">${t.ic}</span><span class="tx"><b>${t.name}</b><span>${t.desc}</span></span>
            <span class="cnt">待辦 <b>${todo}</b>・全部 ${rs.length}</span></button>`; }).join('')}
      </div>
      <div class="rcol">${panelsHTML(L)}</div>
    </div>
    <div class="card" id="guideCard">
      <details id="guide">
        <summary>使用說明（請務必閱讀）</summary>
        <div class="small">
          <h4 class="gh">資料保存與安全</h4>
          <ul>
            <li><b>本機儲存 · 僅在此裝置此瀏覽器有效 · 可匯出備份。</b>資料存在這台電腦、這個瀏覽器裡，不會上傳，也不會同步到其他電腦或手機。</li>
            <li>附件（圖片、PDF）一樣只存在這台電腦的這個瀏覽器裡，換電腦或換瀏覽器就看不到。</li>
            <li>換瀏覽器、換電腦、使用無痕視窗，都看不到原本的資料。<b>請不要使用無痕視窗</b>，關閉後資料會遺失。</li>
            <li>清除瀏覽資料（勾選「Cookie 和其他網站資料」）會讓全部紀錄和附件消失且無法復原。多人共用這台電腦時，請勿清除瀏覽資料。</li>
            <li>請定期按「下載備份」，把備份檔放在這台電腦以外的地方（雲端硬碟或寄給自己）。備份會包含附件，附件越多備份檔越大。</li>
            <li>「最近刪除」的紀錄保留 30 天，超過的會在「下次打開本工具時」永久刪除（不是準時自動刪除）。</li>
          </ul>
          <h4 class="gh">操作步驟</h4>
          <ol>
            <li>從左側選單進入廠商COA報告、原物料外檢報告或儀器校正外檢報告清單。</li>
            <li>先「新增紀錄」建立應收文件清單；還沒收到文件時，收件日期留空，狀態會顯示「缺件」。</li>
            <li>收到文件後，修改該筆、填上收件日期（不能晚於今天），「應提供或更新日期」會自動帶出預設值（可自行修改），並由品管人員判定品質確認狀態。</li>
            <li>每筆紀錄可以加入圖片或 PDF 附件（單檔 20 MB 以內），點縮圖可以打開查看。</li>
            <li>文件收件狀態由日期自動判斷：缺件＝沒有收件日期；需要更新＝進入到期前提示期或品質不合格；尚未更新＝已過到期日；已更新＝其餘。</li>
            <li>預設更新週期與提示期：廠商COA報告 一年、到期前 3 個月；原物料外檢報告 4 個月、到期前 1 個月；儀器校正外檢報告 一年、到期前 3 個月。</li>
            <li>測試請用假資料，不要輸入真實的供應商機密資料。</li>
          </ol>
        </div>
      </details>
    </div>`;
  window.scrollTo(0,0);
}

/* =========================================================
   單一文件類型的清單頁
   ========================================================= */
const TABS = [['todo','待辦'],['missing','缺件'],['need','需要更新'],['late','尚未更新'],['fail','不合格'],['all','全部']];
function inTab(r,tab){
  const s=statusOf(r);
  switch(tab){ case 'todo': return s.k!=='ok'; case 'missing': return s.k==='missing'; case 'need': return s.k==='need';
    case 'late': return s.k==='late'; case 'fail': return r.qc==='fail'; default: return true; }
}
function filteredRecords(){
  const q = listSearch.trim().toLowerCase();
  return ofType(curType).filter(r=>{
    if(!inTab(r,listTab)) return false;
    if(listStatus && statusOf(r).k!==listStatus) return false;
    if(listCat && curType!=='cal' && r.category!==listCat) return false;
    /* 文字搜尋只看清單上看得到的欄位 */
    if(q){ const hay=(curType==='cal' ? [r.docNo,itemLabel(r),rangeText(r),r.supplier] : [r.docNo,r.supplier,r.item,r.category]).join(' ').toLowerCase(); if(!hay.includes(q)) return false; }
    return true;
  }).sort((a,b)=>{
    const sa=statusOf(a), sb=statusOf(b);
    if(sa.rank!==sb.rank) return sa.rank-sb.rank;
    if(sa.rank===1) return (b.createdTs||0)-(a.createdTs||0);
    return (a.dueDate||'9999')<(b.dueDate||'9999')?-1:(a.dueDate===b.dueDate?0:1);
  });
}
function showList(type){

  view='list'; listSel=new Set(); setSide(curType);

  $('#app').innerHTML = `

       <button class="lite" onclick="exportCSV()" title="匯出目前清單（依分頁與篩選）；Excel 可開">匯出報表（Excel）</button>${backupTools()}`)}
    ${kpiHTML(ofType(curType))}
    <div class="card">
      <div class="phd"><b>${t.name}清單</b></div>
      <div class="row tabs" style="margin-bottom:12px">
        ${TABS.map(([k,n])=>`<button class="${listTab===k?'on':''}" onclick="listTab='${k}';listPage=1;showList()">${n}（${cnt[k]}）</button>`).join('')}
      </div>
      <div class="row" style="margin-bottom:12px">
        <input type="text" class="lsearch" placeholder="搜尋 ${curType==='cal'?'儀器／校正範圍／校正公司':'供應商／原料／分類'}／編號" style="max-width:360px" value="${esc(listSearch)}" oninput="listSearch=this.value;listPage=1;listSel=new Set();renderTable()">
        <select class="lsel" style="width:auto" onchange="listStatus=this.value;listPage=1;listSel=new Set();renderTable()">
          <option value="">全部文件狀態</option>

function renderTable(){
  const all = filteredRecords(), cal = curType==='cal';
  const pages = Math.max(1, Math.ceil(all.length/pageSize));
  if(listPage>pages) listPage=pages; if(listPage<1) listPage=1;
  const rs = all.slice((listPage-1)*pageSize, listPage*pageSize);

  if(!rs.length){ $('#tableBox').innerHTML = `<div class="lcount">共 0 件</div><div class="empty">${ofType(curType).length?'沒有符合條件的紀錄':'目前還沒有紀錄，請按「新增紀錄」開始'}</div>`; return; }
  const n = listSel.size, allOn = rs.every(r=>listSel.has(r.uid)), clip = r => (r.files||[]).length ? ' <span title="有附件">📎</span>' : '';

      <button class="danger" onclick="listDelete()" ${n?'':'disabled'}>刪除${n?'（'+n+'）':''}</button></div>
    <div class="muted small" style="margin-bottom:8px">${n?'已勾選 '+n+' 筆':'勾選紀錄後可一次刪除；也可以按每一列右邊的「刪除」'}</div>

    <tbody>${rs.map(r=>`<tr class="click" onclick="openRecord('${r.uid}')">
      <td onclick="event.stopPropagation()"><input type="checkbox" data-id="${esc(r.uid)}" ${listSel.has(r.uid)?'checked':''} onchange="listToggle(this)" aria-label="勾選"></td>
      ${cal
        ? `<td>${esc(itemLabel(r))}${clip(r)}${no(r)}</td><td>${statusBadge(r)}</td><td>${esc(rangeText(r))||'—'}</td><td>${esc(r.supplier)}</td>`
        : `<td>${esc(r.supplier)}${clip(r)}${no(r)}</td><td>${statusBadge(r)}</td><td>${esc(r.item)}${r.category?`<span class="st-sub">${esc(r.category)}</span>`:''}</td>`}
      <td class="nw">${r.receivedDate?fmtDate(r.receivedDate):'—'}</td><td class="nw">${r.dueDate?fmtDate(r.dueDate):'—'}</td>
      <td>${qcBadge(r)}</td>
      <td class="ac" onclick="event.stopPropagation()"><button onclick="openRecord('${r.uid}')">編輯</button> <button onclick="deleteOne('${r.uid}')">刪除</button></td></tr>`).join('')}
    </tbody></table></div>
    <div class="row pager">
      <button onclick="goPage(-1)" ${listPage<=1?'disabled':''}>上一頁</button>
      <span class="small">第 ${listPage}／${pages} 頁（共 ${all.length} 件）</span>
      <button onclick="goPage(1)" ${listPage>=pages?'disabled':''}>下一頁</button>
      <span class="spacer"></span>
      <label class="small muted">每頁
        <select style="width:auto" onchange="setPageSize(this.value)">${PAGE_SIZES.map(x=>`<option value="${x}" ${x===pageSize?'selected':''}>${x}</option>`).join('')}</select> 件</label>
    </div>`;
}
/* 換頁時，勾選會自動取消（避免刪除看不到的紀錄） */
function goPage(d){ listPage+=d; listSel=new Set(); renderTable(); }
function setPageSize(v){
  pageSize=parseInt(v,10)||20; listPage=1; listSel=new Set();
  try{ localStorage.setItem('casevoraCoaTracker_pageSize', String(pageSize)); }catch(e){}
  renderTable();
}
function listAll(on){
  const all=filteredRecords();
  all.slice((listPage-1)*pageSize, listPage*pageSize).forEach(r=>on?listSel.add(r.uid):listSel.delete(r.uid));
  renderTable();
}
function listToggle(el){ const id=el.dataset.id; if(el.checked) listSel.add(id); else listSel.delete(id); renderTable(); }
async function deleteOne(uid){
  const r=records.find(x=>x.uid===uid); if(!r||r.deleted) return;
  if(!(await ask('確定要刪除嗎？'))) return;
  r.deleted=true; r.deletedAt=today();
  if(!persist()){ r.deleted=false; delete r.deletedAt; return; }
  listSel.delete(uid); showList(); flash('已移到「最近刪除」');
}
async function listDelete(){
  const ids=[...listSel].filter(id=>{ const r=records.find(x=>x.uid===id); return r && !r.deleted; });
  if(!ids.length) return;
  if(!(await ask(`確定要刪除選取的 ${ids.length} 筆嗎？`))) return;
  const done=[]; records.forEach(r=>{ if(ids.includes(r.uid)){ r.deleted=true; r.deletedAt=today(); done.push(r); } });
  if(!persist()){ done.forEach(r=>{ r.deleted=false; delete r.deletedAt; }); return; }
  listSel=new Set(); showList(); flash('已移到「最近刪除」（'+done.length+' 筆）');
}

async function renderAtts(){
  const box=$('#atts'); if(!box||!cur) return;
  attUrls.forEach(u=>URL.revokeObjectURL(u)); attUrls=[];
  const fs=cur.files||[];
  if(!fs.length){ box.innerHTML=''; return; }
  const items=await Promise.all(fs.map(async f=>{ let o=null; try{ o=await fGet(f.id); }catch(e){} return {f,o}; }));
  if($('#atts')!==box) return;
  box.innerHTML=items.map(({f,o})=>{
    let pv='<span title="找不到檔案">⚠️</span>';
    if(o){ const u=URL.createObjectURL(o.blob); attUrls.push(u);
      pv=`<a class="pv" href="${u}" target="_blank" rel="noopener">${f.type.startsWith('image/')?`<img src="${u}" alt="">`:'📄'}</a>`; }
    return `<div class="att">${pv}<span class="nm">${esc(f.name)}<br><span class="muted">${fmtSize(f.size)}</span></span>
      <button class="danger" onclick="removeAtt('${f.id}')">移除</button></div>`;
  }).join('');
}
async function addFiles(input){
  const list=[...input.files]; input.value='';
  for(const file of list){
    if(!(file.type.startsWith('image/')||file.type==='application/pdf')){ alert(`「${file.name}」不是圖片或 PDF，已略過。`); continue; }
    if(file.size>MAX_FILE){ alert(`「${file.name}」超過 20 MB，已略過。`); continue; }
    const meta={id:'f'+newUid().slice(1), name:file.name, type:file.type, size:file.size};
    try{ await fPut(Object.assign({blob:file, addedAt:new Date().toISOString()},meta)); }
    catch(e){ alert(`「${file.name}」存不進去，瀏覽器的儲存空間可能已滿。請先「下載備份」，再移除不需要的附件。`); continue; }
    cur.files.push(meta); dirty=true;
  }
  refreshForm(); renderAtts();
}
function removeAtt(id){
  if(!confirm('確定要移除這個附件嗎？（按「儲存」後才會生效）')) return;
  cur.files=cur.files.filter(f=>f.id!==id); dirty=true; refreshForm(); renderAtts();
}

function recvError(r){ return r.receivedDate && r.receivedDate > today() ? '收件日期不能晚於今天' : ''; }
function dueError(r){
  if(r.receivedDate && !r.dueDate) return '請填寫應提供或更新日期';
  if(r.receivedDate && r.dueDate && r.dueDate < r.receivedDate) return '應提供或更新日期不能早於收件日期';
  return '';
}
function refreshForm(){
  const r=cur, t=TYPES[r.docType];
  const due=$('#inDue'); due.disabled=!r.receivedDate; if(due.value!==r.dueDate) due.value=r.dueDate;
  $('#dueHint').textContent = !r.receivedDate ? '（收到文件、填寫收件日期後，會自動帶出預設日期）'
    : monthsOf(r) ? `（預設：收件日期＋${perLabel(r)}，可自行修改；到期前 ${leadOf(r)} 個月開始顯示「需要更新」）`
    : `（自訂日期：請直接填寫；到期前 ${leadOf(r)} 個月開始顯示「需要更新」）`;
  const e=dueError(r); $('#dueErr').textContent=e; due.classList.toggle('bad',!!e);
  const re=recvError(r); $('#recvErr').textContent=re; $('#inRecv').classList.toggle('bad',!!re);
  const qc=$('#inQc'); qc.disabled=!r.receivedDate; if(qc.value!==r.qc) qc.value=r.qc;
  $('#qcHint').textContent = r.receivedDate ? '' : '（收到文件後才能判定品質）';
  $('#stBadge').innerHTML = statusBadge(r); $('#stBox').innerHTML = statusBadge(r);
  $('#dirtyMark').innerHTML = dirty ? '<span class="dirty">● 有尚未儲存的修改</span>' : '';
}
function onField(el){
  const f=el.dataset.f, oldAuto=autoOf(cur);
  cur[f]=el.value; dirty=true;
  if(f==='period' && cur.receivedDate && monthsOf(cur)) cur.dueDate=autoOf(cur);
  if(f==='receivedDate'){
    if(cur.receivedDate && (!cur.dueDate || cur.dueDate===oldAuto)) cur.dueDate=autoOf(cur);
    if(!cur.receivedDate){ cur.dueDate=''; cur.qc='pending'; }
  }
  if(f==='item' && cur.docType==='cal'){
    const ins=instrOf(cur.item);
    cur.rUnit = ins && ins[1] ? ins[1][0] : '';
    if(!ins || !ins[2]){ cur.r2From=''; cur.r2To=''; }
    if(cur.item!=='其他') cur.itemOther='';
    renderDetail(); return;
  }
  refreshForm();
}
function saveRecord(){
  const r=cur, t=TYPES[r.docType], miss=[];
  if(!r.supplier.trim()) miss.push(t.sup);
  if(!r.item.trim()) miss.push(t.item);
  else if(r.item==='其他' && !r.itemOther.trim()) miss.push('儀器名稱（其他）');
  if(miss.length){ alert('請先填寫：'+miss.join('、')); return; }
  if(recvError(r)){ const el=$('#inRecv'); el.scrollIntoView({block:'center'}); el.focus(); alert('收件日期不能晚於今天'); return; }
  if(dueError(r)){ const el=$('#inDue'); el.scrollIntoView({block:'center'}); el.focus(); return; }
  const isNew=!r.uid;
  if(isNew){ r.uid=newUid(); r.createdAt=new Date().toLocaleString('zh-TW'); r.createdTs=Date.now(); }
  r.updatedAt=new Date().toLocaleString('zh-TW');
  const backupList=records.slice(), i=records.findIndex(x=>x.uid===r.uid), copy=JSON.parse(JSON.stringify(r));
  if(i>=0) records[i]=copy; else records.push(copy);
  if(!persist()){ records=backupList; if(isNew) r.uid=''; return; }
  dirty=false; cleanupFiles();
  if(isNew){ showList(); flash('已儲存'); return; }
  $('#savedAt').textContent='最後儲存：'+r.updatedAt; refreshForm(); flash('已儲存');
}
async function deleteRecord(){
  if(!(await ask('確定要刪除嗎？'))) return;
  const rec=records.find(x=>x.uid===cur.uid); if(!rec) return;
  rec.deleted=true; rec.deletedAt=today();
  if(!persist()){ rec.deleted=false; delete rec.deletedAt; return; }
  dirty=false; showList(); flash('已移到「最近刪除」');
}
window.addEventListener('beforeunload', e=>{ if(dirty){ e.preventDefault(); e.returnValue=''; } });

function trashList(){ return records.filter(r=>r.deleted).sort((a,b)=>(b.deletedAt||'').localeCompare(a.deletedAt||'')||(b.createdTs||0)-(a.createdTs||0)); }
function daysLeft(r){ return 30-daysBetween(r.deletedAt||today(),today()); }
let trashBack='';
function showTrash(){ if(!leave()) return; trashBack = view==='list' ? curType : ''; view='trash'; setSide('trash'); trashSel=new Set(); renderTrash(); window.scrollTo(0,0); }
function renderTrash(){
  const rs=trashList(), n=trashSel.size;
  $('#app').innerHTML = `
    <div class="hcard">
      <div class="hc-top"><div class="ptitle"><h1>最近刪除</h1><div class="eyebrow">RECENTLY DELETED</div></div><span class="lbadge">● 本機資料模式</span></div>
      <div class="hc-bot" style="margin-top:0"><div class="hcrumb">Casevoras / <b>最近刪除</b></div>
        <div class="ptools"><button class="lite" onclick="${view==='trash'&&trashBack?`showList('${trashBack}')`:'showHome()'}">← 返回清單</button></div></div>
    </div>
    <div class="card">
      <div class="notice info small">已刪除超過 30 天的紀錄，會在下次打開本工具時永久刪除。</div>
      <div class="row" style="margin:8px 0">
        <button onclick="trashAll()" ${rs.length?'':'disabled'}>全選</button>
        <button onclick="trashNone()" ${n?'':'disabled'}>全部不選</button>
        <button onclick="trashRestore()" ${n?'':'disabled'}>還原</button>
        <button class="danger" onclick="trashPerm()" ${n?'':'disabled'}>永久刪除</button>
        <span class="muted small">${n?('已勾選 '+n+' 筆'):'請先勾選紀錄'}</span>
      </div>
      ${rs.length?`<div style="overflow-x:auto"><table><thead><tr><th></th><th>文件類型</th><th>編號</th><th>刪除日期</th><th>供應商／校正公司</th><th>原料／產品／儀器</th><th>保留</th></tr></thead><tbody>
        ${rs.map(r=>`<tr><td><input type="checkbox" data-id="${esc(r.uid)}" ${trashSel.has(r.uid)?'checked':''} onchange="trashToggle(this)"></td>
          <td class="small">${esc(TYPES[r.docType].name)}</td><td>${esc(r.docNo)||'—'}</td><td>${fmtDate(r.deletedAt)}</td><td>${esc(r.supplier)}</td><td>${esc(itemLabel(r))}</td><td class="small muted">剩 ${Math.max(daysLeft(r),0)} 天</td></tr>`).join('')}
      </tbody></table></div>`:'<div class="empty">目前沒有刪除的紀錄</div>'}
    </div>`;
}
function trashToggle(el){ const id=el.dataset.id; if(el.checked) trashSel.add(id); else trashSel.delete(id); renderTrash(); }
function trashAll(){ trashSel=new Set(trashList().map(r=>r.uid)); renderTrash(); }
function trashNone(){ trashSel=new Set(); renderTrash(); }
function trashRestore(){
  if(!trashSel.size) return;
  const ids=[...trashSel], done=[];
  records.forEach(r=>{ if(ids.includes(r.uid)&&r.deleted){ r.deleted=false; delete r.deletedAt; done.push(r); } });
  if(!persist()){ done.forEach(r=>{ r.deleted=true; r.deletedAt=today(); }); return; }
  trashSel=new Set(); renderTrash(); flash('已還原 '+done.length+' 筆');
}
async function trashPerm(){
  const n=trashSel.size; if(!n) return;
  if(!(await ask(`確定要永久刪除選取的 ${n} 筆嗎？永久刪除後無法復原。`))) return;
  const ids=new Set(trashSel), old=records;
  records=records.filter(r=>!ids.has(r.uid));
  if(!persist()){ records=old; return; }
  trashSel=new Set(); renderTrash(); cleanupFiles(); flash('已永久刪除 '+n+' 筆');
}
function purgeExpired(){
  const exp=records.filter(r=>r.deleted&&r.deletedAt&&today()>addDays(r.deletedAt,30));
  if(!exp.length) return;
  const ids=new Set(exp.map(r=>r.uid)); records=records.filter(r=>!ids.has(r.uid)); persist();
}

    '文件收件狀態','狀態說明','品質確認狀態','附件數','備註','最後儲存'];

    return [r.docNo,TYPES[r.docType].name, cal?itemLabel(r):r.supplier, cal?rangeText(r):r.item, ...(cal?[r.supplier]:[r.category]),

const CRCT=(()=>{const t=[];for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();

    off+=lh.length+nm.length+d.length;

/* =========================================================
   從 Excel 匯入（原料檢驗報告追蹤表）：檔案只在這台電腦的瀏覽器裡讀取
   ========================================================= */
let pendingImport = null;
async function readXlsx(file){
  const buf=new Uint8Array(await file.arrayBuffer()), dv=new DataView(buf.buffer), td=new TextDecoder();
  let e=buf.length-22; while(e>=0 && dv.getUint32(e,true)!==0x06054b50) e--;
  if(e<0) throw new Error('not zip');
  const n=dv.getUint16(e+10,true), files={}; let p=dv.getUint32(e+16,true);
  for(let i=0;i<n;i++){
    const nl=dv.getUint16(p+28,true), xl=dv.getUint16(p+30,true), cl=dv.getUint16(p+32,true);
    files[td.decode(buf.subarray(p+46,p+46+nl))]={method:dv.getUint16(p+10,true), size:dv.getUint32(p+20,true), lo:dv.getUint32(p+42,true)};
    p+=46+nl+xl+cl;
  }
  const read=async name=>{
    const f=files[name]; if(!f) return null;
    const st=f.lo+30+dv.getUint16(f.lo+26,true)+dv.getUint16(f.lo+28,true), data=buf.subarray(st,st+f.size);
    if(f.method===0) return td.decode(data);
    return await new Response(new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).text();
  };
  const xml=t=>new DOMParser().parseFromString(t,'application/xml'), tags=(d,n)=>[...d.getElementsByTagName(n)];
  const ss=[]; const sst=await read('xl/sharedStrings.xml');
  if(sst) tags(xml(sst),'si').forEach(si=>ss.push(tags(si,'t').map(t=>t.textContent).join('')));
  const rels={}; tags(xml(await read('xl/_rels/workbook.xml.rels')),'Relationship').forEach(r=>rels[r.getAttribute('Id')]=r.getAttribute('Target'));
  const colIdx=ref=>{ let n=0; for(const ch of ref.replace(/\d+/g,'')) n=n*26+ch.charCodeAt(0)-64; return n-1; };
  const out=[];
  for(const sh of tags(xml(await read('xl/workbook.xml')),'sheet')){
    const rid=sh.getAttribute('r:id')||sh.getAttributeNS('http://schemas.openxmlformats.org/officeDocument/2006/relationships','id');
    let tg=rels[rid]||''; tg=tg.startsWith('/')?tg.slice(1):'xl/'+tg;
    const t=await read(tg); if(!t) continue;
    const rows=[];
    tags(xml(t),'row').forEach(rw=>{ const ri=+rw.getAttribute('r')-1, row=[];
      tags(rw,'c').forEach(c=>{ const ty=c.getAttribute('t'), v=c.getElementsByTagName('v')[0]; let val=null;
        if(ty==='s') val=v?ss[+v.textContent]:null;
        else if(ty==='inlineStr') val=tags(c,'t').map(x=>x.textContent).join('');
        else if(v) val=(ty==='str'||ty==='e')?v.textContent:(ty==='b'?v.textContent==='1':+v.textContent);
        if(val!=null&&val!=='') row[colIdx(c.getAttribute('r'))]=val; });
      rows[ri]=row; });
    out.push({name:sh.getAttribute('name'), rows});
  }
  return out;
}
const SHEET_CAT={'水產':'水產','家畜':'家畜','禽類':'禽類','蔬菜+副原料':'蔬菜＋副原料','蔬菜＋副原料':'蔬菜＋副原料','調味料':'調味料','香料':'香料','包材':'包材'};
const serialDate=n=>{ const d=new Date(Date.UTC(1899,11,30)+Math.round(n)*86400000); return d.toISOString().slice(0,10); };
function cellDate(v){
  if(typeof v==='number' && v>20000 && v<80000) return serialDate(v);
  if(typeof v==='string'){ const m=/^\s*(\d{4})[.\/-](\d{1,2})[.\/-](\d{1,2})\s*$/.exec(v); if(m){ const d=`${m[1]}-${p2(+m[2])}-${p2(+m[3])}`; return isNaN(new Date(d))?'':d; } }
  return '';
}
const str=v=>v==null?'':String(v).trim();
function parsePeriod(v){
  if(v==null||str(v)==='') return {period:''};
  if(typeof v==='number' && [1,2,3,5].includes(v)) return {period:v+'y'};
  const d=cellDate(v); if(d) return {period:'custom', due:d};
  const t=str(v), m={'半年':'6m','1年':'1y','2年':'2y','3年':'3y','5年':'5y','4個月':'4m'}[t.replace(/\s/g,'')];
  return m ? {period:m} : {period:'', raw:t};
}
/* 「進口分析20270224」「輸入許可20260503」：表頭寫的是進口效期，只認這兩種明確寫法 */
function parseImport(t){
  const m=/(進口分析|輸入許可|進口許可)\s*(\d{4})(\d{2})(\d{2})/.exec(t||''); if(!m) return '';
  const d=`${m[2]}-${m[3]}-${m[4]}`; return isNaN(new Date(d))?'':d;
}
function parseProvide(t){ return /官網下載/.test(t)?'官網下載':/隨貨/.test(t)?'隨貨':''; }
function planImport(sheets){
  const plan={recs:[], flags:[], skipped:[], dup:0, sheets:[], noVendor:0, noItem:[]}, td=today();
  const keys=new Set(records.map(r=>r.importKey).filter(Boolean));
  for(const sh of sheets){
    const hdr=(sh.rows[0]||[]).map(str), find=(...ns)=>hdr.findIndex(h=>ns.includes(h));
    const iItem=find('原料品項');
    if(iItem<0){ plan.skipped.push(sh.name); continue; }
    const iVen=find('廠商'), iExt=find('外驗日期','外驗報告'), iRep=find('廠商報告','報告日期'), iDue=find('期限','年限'),
          iReq=find('檢驗表需求'), iPermit=find('許可證'), iFlag=find('報告過期標示');
    const sheetVen=(/^廠商-(.+)$/.exec(sh.name)||[])[1]||'', cat=SHEET_CAT[sh.name]||'其他';
    let n=0;
    for(let ri=1; ri<sh.rows.length; ri++){
      const row=sh.rows[ri]||[], c=i=>i<0?null:row[i], item=str(c(iItem));
      if(!item){ if(row.some(v=>v!=null&&str(v)!=='')) plan.noItem.push(`${sh.name} 第 ${ri+1} 列`); continue; }
      const ven=str(c(iVen)), self=ven==='自驗SGS', where=`${sh.name} 第 ${ri+1} 列`;
      const base={category:cat, item, testReq:str(c(iReq)), importedFrom:where};
      const extNote=[iPermit>=0&&str(c(iPermit))?'許可證：'+str(c(iPermit)):'', iFlag>=0&&str(c(iFlag))?'報告過期標示：'+str(c(iFlag)):''].filter(Boolean);
      const add=(kind, rec, reasons)=>{
        const key=`${sh.name}#${ri+1}#${kind}`;
        if(keys.has(key)){ plan.dup++; return; }
        const r=Object.assign(blankRecord(kind), base, rec, {importKey:key});
        if(!r.period) r.period=TYPES[kind].per;
        if(r.receivedDate && r.receivedDate>td){ reasons.push(`收件日期 ${fmtDate(r.receivedDate)} 晚於今天，已改放備註`); r.note=[r.note,'原收件日期：'+fmtDate(r.receivedDate)].filter(Boolean).join('\n'); r.receivedDate=''; }
        if(r.period!=='custom') r.dueDate=autoOf(r);
        if(!r.supplier){ r.supplier='（未填廠商）'; plan.noVendor++; }
        r.note=[`【Excel 匯入：${where}】`, r.note].filter(Boolean).join('\n');
        plan.recs.push(r); n++;
        if(reasons.length) plan.flags.push({where, item, type:TYPES[kind].name, reasons});
      };
      const hasExt = self || (iExt>=0 && c(iExt)!=null);
      if(hasExt){
        const reasons=[], ti=str(c(iExt+1)), d=cellDate(c(iExt)), raw=c(iExt);
        const note=[...extNote]; if(raw!=null && !d){ note.push('原外驗日期：'+str(raw)); reasons.push('外驗日期看不懂，已改放備註'); }
        if(self && iRep>=0){ const more=[str(c(iRep+1)), str(c(iRep))].filter(Boolean); if(more.length) note.push('其他記載：'+more.join('／')); }
        add('raw', {supplier:ven, receivedDate:d, testItems:ti, note:note.join('\n')}, reasons);
      }
      if(!self){
        const hasRep = iRep>=0 && (c(iRep)!=null || c(iRep+1)!=null || c(iDue)!=null || !hasExt);
        if(hasRep || !hasExt){
          const reasons=[], raw=iRep>=0?c(iRep):null, d=cellDate(raw), ti=iRep>=0?str(c(iRep+1)):'', note=[...extNote];
          if(raw!=null && !d){ note.push('原廠商報告欄：'+str(raw)); reasons.push('廠商報告日期看不懂，已改放備註'); }
          const per=parsePeriod(iDue>=0?c(iDue):null);
          if(per.raw){ note.push('原期限：'+per.raw); reasons.push(`期限「${per.raw.replace(/\n/g,' ')}」看不懂，先用預設週期`); }
          const rec={supplier:ven||sheetVen, receivedDate:d, testItems:ti, period:per.period, importExpiry:parseImport(ti), provide:parseProvide(ti), note:note.join('\n')};
          if(per.due) rec.dueDate=per.due;
          if(per.due && !d) reasons.push('有期限但沒有收件日期，會顯示為「缺件」');
          add('coa', rec, reasons);
        }
      }
    }
    plan.sheets.push({name:sh.name, n});
  }
  return plan;
}
async function importXlsx(input){
  const file=input.files[0]; input.value=''; if(!file) return;
  if(!leave()) return;
  if(typeof DecompressionStream==='undefined'){ alert('這個瀏覽器版本太舊，無法讀取 Excel。請更新 Chrome 或 Edge 後再試。'); return; }
  let sheets;
  try{ sheets=await readXlsx(file); }catch(e){ alert('無法讀取：請確認是 .xlsx 格式的 Excel 檔（舊版 .xls 請先另存成 .xlsx）。'); return; }
  pendingImport=planImport(sheets); pendingImport.file=file.name;
  if(!pendingImport.recs.length){ alert(pendingImport.dup?'這份檔案的資料之前都已經匯入過了，沒有新的紀錄。':'找不到可以匯入的資料（需要有「原料品項」欄位的工作表）。'); pendingImport=null; return; }
  showImportPreview();
}

      ${P.flags.map(f=>`<tr><td class="nw">${esc(f.where)}</td><td>${esc(f.item)}</td><td class="nw">${esc(f.type)}</td><td>${f.reasons.map(esc).join('<br>')}</td></tr>`).join('')}

function confirmImport(){
  const P=pendingImport; if(!P) return;
  if(!confirm(`確定要匯入 ${P.recs.length} 筆嗎？`)) return;
  const now=Date.now(), stamp=new Date().toLocaleString('zh-TW'), old=records.slice();
  P.recs.forEach((r,i)=>{ r.uid=newUid(); r.createdTs=now+i; r.createdAt=stamp; r.updatedAt=stamp; delete r.importedFrom; records.push(r); });
  if(!persist()){ records=old; return; }
  pendingImport=null; showHome(); flash(`已匯入 ${P.recs.length} 筆`);
}
async function backup(){
  const rs=live(), ids=new Set(rs.flatMap(r=>r.files.map(f=>f.id)));
  let files=[];
  try{
    if(ids.size) flash('正在準備備份（含附件）…');
    for(const o of (await fAll()).filter(o=>ids.has(o.id)))
      files.push({id:o.id, name:o.name, type:o.type, size:o.size, addedAt:o.addedAt, data:await blobToDataUrl(o.blob)});
  }catch(e){ if(!confirm('附件讀取失敗，要只備份文字紀錄（不含附件）嗎？')) return; files=[]; }
  download(JSON.stringify({app:'casevoraCoaTracker', version:3, exportedAt:new Date().toISOString(), records:rs, files},null,1),
    `coa_backup_${today()}.json`, 'application/json');
}
function restore(input){
  const file=input.files[0]; input.value=''; if(!file) return;
  const fr=new FileReader();
  fr.onload=async ()=>{
    let data;
    try{ data=JSON.parse(fr.result); if(!data || data.app!=='casevoraCoaTracker' || !Array.isArray(data.records)) throw 0; }
    catch(e){ alert('無法讀取：這不是本工具的備份檔。'); return; }
    const trashN=records.filter(r=>r.deleted).length;
    if(!confirm(`備份檔內有 ${data.records.length} 筆紀錄。\n還原會「取代」目前瀏覽器中的 ${live().length} 筆資料，目前「最近刪除」裡的 ${trashN} 筆也會一併被取代，確定嗎？`)) return;
    const old=records, seen=new Set();
    const files=(Array.isArray(data.files)?data.files:[]).filter(f=>f&&f.id&&typeof f.data==='string'&&f.data.startsWith('data:'));
    const avail=new Set(files.map(f=>f.id));
    records=[];
    data.records.filter(r=>r&&typeof r==='object').forEach(r=>{
      const o=migrate(Object.assign({},r,{deleted:false}));
      if(seen.has(o.uid)) o.uid=newUid();
      o.files=o.files.filter(f=>f&&avail.has(f.id));
      seen.add(o.uid); records.push(o);
    });
    try{
      const blobs=await Promise.all(files.map(async f=>({id:f.id, name:String(f.name||''), type:String(f.type||''), size:+f.size||0, addedAt:f.addedAt, blob:await (await fetch(f.data)).blob()})));
      await fClear();
      if(blobs.length) await fx('readwrite', st=>{ blobs.forEach(b=>st.put(b)); });
    }catch(e){ records=old; alert('還原附件失敗，資料沒有變動。瀏覽器的儲存空間可能不夠。'); return; }
    if(!persist()){ records=old; return; }
    dirty=false; cur=null; flash('還原完成'); showHome();
  };
  fr.readAsText(file);
}
